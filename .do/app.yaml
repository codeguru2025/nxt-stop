# DigitalOcean App Platform Spec
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# COST NOTE: Valkey/Redis was dropped from this setup on purpose. It was only used as an
# optional Socket.IO multi-instance adapter and a QR-code cache — both degrade gracefully
# without it (see src/server.ts and src/lib/qr.ts) — so it's pure monthly cost with no
# functional loss at instance_count: 1.
#
# SETUP CHECKLIST:
# 1. Create managed PostgreSQL database "nxt-stop" in LON1
# 2. Create a Space named exactly "nxtstop-uploads" in LON1 with CDN enabled
#    (must match this name/region — the app has image URLs hardcoded to
#    https://nxtstop-uploads.lon1.cdn.digitaloceanspaces.com/<filename>)
# 3. Add this app's component as a trusted source on the database (Network Access tab)
# 4. Set all environment variables in the App Platform dashboard (REDIS_URL can be left unset)
# 5. After first deploy: run `npx prisma db push` using DIRECT_URL (non-pooled connection)

name: nxt-stop
region: lon

services:
  - name: nxt-stop
    github:
      repo: codeguru2025/nxt-stop
      branch: master
      deploy_on_push: true

    # Build
    build_command: npm ci && npm run build
    run_command: npm start
    environment_slug: node-js

    # Resources
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb

    # Health check
    http_port: 3000
    health_check:
      http_path: /api/health

    # Routes
    routes:
      - path: /

    # Environment variables
    # Set these in the App Platform dashboard, NOT here (secrets should not be in YAML)
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"

# Databases (reference only — create these manually via DO dashboard first)
# databases:
#   - name: nxt-stop
#     engine: PG
#     version: "18"
#     size: db-s-1vcpu-1gb
#     num_nodes: 1
